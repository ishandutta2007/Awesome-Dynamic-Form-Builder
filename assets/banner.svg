<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#4f46e5" fill-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Style for Dynamic Keyframe Animations -->
  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarPulse {
      0% { r: 6px; opacity: 1; }
      100% { r: 24px; opacity: 0; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1000px 260px;
    }
    .card-float-1 {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .card-float-2 {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .active-flow {
      stroke-dasharray: 8 6;
      animation: flowLine 2.5s linear infinite;
    }
    .sonar-ping {
      animation: radarPulse 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Atmospheric Orbs (Background) -->
  <circle class="orb-1" cx="220" cy="90" r="130" fill="#6366f1" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="270" r="140" fill="#ec4899" filter="url(#glow)" />
  <circle cx="950" cy="80" r="90" fill="#38bdf8" filter="url(#glow)" opacity="0.25" />

  <!-- Dynamic Animated Branching Flow in Background -->
  <g opacity="0.45">
    <path d="M 820 180 C 880 180, 900 110, 960 110" fill="none" stroke="#6366f1" stroke-width="2.5" class="active-flow" />
    <path d="M 820 180 C 880 180, 900 250, 960 250" fill="none" stroke="#ec4899" stroke-width="2.5" class="active-flow" />
    <circle cx="820" cy="180" r="5" fill="#a855f7" />
    <circle cx="960" cy="110" r="4" fill="#38bdf8" />
    <circle cx="960" cy="250" r="4" fill="#ec4899" />
  </g>

  <!-- Floating Dynamic UI Mockup Cards on Right Side -->
  <g class="card-float-1" transform="translate(860, 48)">
    <rect width="280" height="110" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" filter="url(#pulseGlow)" />
    <!-- Logic pill -->
    <rect x="18" y="18" width="92" height="20" rx="10" fill="#4338ca" />
    <text x="64" y="32" fill="#c7d2fe" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">IF (Score &gt; 80)</text>
    <!-- Dynamic Field Mockup -->
    <rect x="18" y="48" width="244" height="22" rx="6" fill="#334155" fill-opacity="0.6" stroke="#64748b" stroke-width="0.8" />
    <text x="28" y="63" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Show Qualified Lead Step</text>
    <!-- Switch toggle -->
    <rect x="226" y="52" width="26" height="14" rx="7" fill="#10b981" />
    <circle cx="245" cy="59" r="5" fill="#ffffff" />
    <!-- Dynamic radar indicator -->
    <circle class="sonar-ping" cx="245" cy="59" r="6" fill="none" stroke="#10b981" stroke-width="2" />
    <text x="18" y="93" fill="#38bdf8" font-size="9.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500">⚡ Branch Activated • Dynamic Action</text>
  </g>

  <g class="card-float-2" transform="translate(820, 185)">
    <rect width="320" height="120" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" filter="url(#pulseGlow)" />
    <!-- Card header -->
    <circle cx="32" cy="28" r="7" fill="#ec4899" />
    <text x="48" y="32" fill="#f1f5f9" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700">JSON Schema Reactive Engine</text>
    <rect x="20" y="48" width="280" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="28" y="62" fill="#a5b4fc" font-size="10" font-family="monospace">{"status": "valid", "rules": 18}</text>
    <rect x="20" y="76" width="130" height="24" rx="6" fill="#4f46e5" />
    <text x="85" y="92" fill="#ffffff" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">✓ Auto Calculated</text>
    <rect x="160" y="76" width="140" height="24" rx="6" fill="#0f172a" stroke="#475569" stroke-width="0.8" />
    <text x="230" y="92" fill="#38bdf8" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">📡 Real-Time Sync</text>
  </g>

  <!-- Foreground Title and Content (Unobstructed & Dominant) -->
  <g transform="translate(70, 75)">
    <!-- Category Tag Badge -->
    <rect x="0" y="0" width="248" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="16" cy="14" r="5" fill="#38bdf8" />
    <circle class="sonar-ping" cx="16" cy="14" r="6" fill="none" stroke="#38bdf8" stroke-width="2" />
    <text x="132" y="19" fill="#e0e7ff" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" letter-spacing="0.8" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="75" fill="#ffffff" font-size="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" letter-spacing="-1">
      Awesome Dynamic
    </text>
    <text x="410" y="75" fill="url(#accentGrad)" font-size="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" letter-spacing="-1">
      Form Builder
    </text>

    <!-- Subtitle -->
    <text x="0" y="116" fill="#cbd5e1" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400">
      Enterprise SaaS Platforms, Low-Code Engines &amp; Open-Source Form Builders
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 142)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="138" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="69" y="18" fill="#a5b4fc" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">⚡ Logic Branching</text>

      <!-- Tag 2 -->
      <rect x="148" y="0" width="144" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="220" y="18" fill="#f472b6" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">📋 Multi-Step Forms</text>

      <!-- Tag 3 -->
      <rect x="302" y="0" width="144" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="374" y="18" fill="#38bdf8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">🌐 Self-Hostable OSS</text>

      <!-- Tag 4 -->
      <rect x="456" y="0" width="142" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="527" y="18" fill="#34d399" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">📊 Data Automation</text>
    </g>

    <!-- Decorative bottom highlight bar -->
    <rect x="0" y="196" width="620" height="3" rx="1.5" fill="url(#accentGrad)" />
  </g>
</svg>
